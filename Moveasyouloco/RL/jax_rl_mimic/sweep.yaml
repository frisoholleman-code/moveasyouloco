program: Moveasyouloco/RL/jax_rl_mimic/experiment.py
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
method: random
metric:
  goal: minimize
  name: Metric for Sweep
parameters:
  experiment.env_params.reward_params.qpos_w_sum:
    distribution: normal
    mu: 0.4
    sigma: 0.15
  experiment.env_params.reward_params.qvel_w_sum:
    distribution: normal
    mu: 0.2
    sigma: 0.1
  experiment.env_params.reward_params.rpos_w_sum:
    distribution: normal
    mu: 0.5
    sigma: 0.2
  experiment.env_params.reward_params.rquat_w_sum:
    distribution: normal
    mu: 0.3
    sigma: 0.15
  experiment.env_params.reward_params.rvel_w_sum:
    distribution: normal
    mu: 0.2
    sigma: 0.1
  experiment.env_params.reward_params.joint_acc_coeff:
    distribution: uniform
    max: 0.1
    min: 0
  experiment.env_params.reward_params.joint_torque_coeff:
    distribution: uniform
    max: 0.1
    min: 0